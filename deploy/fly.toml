# deploy/fly.toml
app = "ai-browser-agent"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATA_DIR = "/data"
  AI_PROVIDER = "cloudflare"
  CF_MODEL = "@cf/openai/gpt-oss-20b"
  HUMAN_APPROVAL_REQUIRED = "true"
  SCHEDULER_TICK_MS = "15000"
  BROWSER_HEADLESS = "true"

[[mounts]]
  source = "agent_data"
  destination = "/data"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "4s"
    grace_period = "20s"

  [[services.http_checks]]
    interval = "15s"
    timeout = "4s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"
    protocol = "http"

[[vm]]
  size = "shared-cpu-2x"
  memory = "4096"
