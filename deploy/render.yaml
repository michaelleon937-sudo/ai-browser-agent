# deploy/render.yaml
services:
  - type: web
    name: ai-browser-agent
    env: docker
    plan: standard
    region: oregon
    dockerfilePath: ../Dockerfile
    dockerContext: ..
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: agent-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATA_DIR
        value: /data
      - key: AI_PROVIDER
        value: cloudflare
      - key: CF_MODEL
        value: "@cf/openai/gpt-oss-20b"
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
      - key: HUMAN_APPROVAL_REQUIRED
        value: "true"
      - key: SCHEDULER_TICK_MS
        value: "15000"
      - key: BROWSER_HEADLESS
        value: "true"
      - key: DASHBOARD_USER
        sync: false
      - key: DASHBOARD_PASS
        sync: false
