name = "ai-browser-agent"
main = "cloudflare/worker.js"
compatibility_date = "2026-11-02"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[ai]
binding = "AI"

[browser]
binding = "BROWSER"

[[durable_objects.bindings]]
name = "REPLAY_GUARD"
class_name = "ReplayGuard"

[[migrations]]
tag = "v1"
new_classes = ["ReplayGuard"]

[vars]
AI_MODEL = "@cf/openai/gpt-oss-20b"
BUILD_SHA = "cloudflare-email-preview-2026-11-17"
SENTRY_ENVIRONMENT = "preview"
NEXORA_EMAIL_ASSISTANT_URL = "https://nexora-intelligence-git-fe-919e70-michaelleon937-sudos-projects.vercel.app/api/agent/email-assistant"
EMAIL_AUTOREPLY_ENABLED = "false"

[previews.vars]
AI_MODEL = "@cf/openai/gpt-oss-20b"
BUILD_SHA = "cloudflare-email-preview-2026-11-17"
SENTRY_ENVIRONMENT = "preview"
NEXORA_EMAIL_ASSISTANT_URL = "https://nexora-intelligence-git-fe-919e70-michaelleon937-sudos-projects.vercel.app/api/agent/email-assistant"
EMAIL_AUTOREPLY_ENABLED = "false"
CLOUDMAILIN_API_BASE_URL = "https://api.cloudmailin.com/api/v0.1"
CLOUDMAILIN_OUTBOUND_TEST_MODE = "true"
