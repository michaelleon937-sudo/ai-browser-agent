name: A2 Certification

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - feature/phase-a2-inbound-provider-finalization
      - feature/email-cloudmailin-production-fix
      - master

jobs:
  a2-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_DIR: ${{ github.workspace }}/.test-data
      NODE_ENV: test
      FFMPEG_BIN: /usr/bin/ffmpeg
      BLENDER_BIN: /usr/bin/blender
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install system dependencies required by repository integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg blender libegl1 libgl1 libglx-mesa0 libgbm1
          command -v ffmpeg
          command -v blender
          ffmpeg -version | head -n 1
          blender --background --version
          ldconfig -p | grep -E 'libEGL.so.1|libGL.so.1|libgbm.so.1'
      - name: Install dependencies
        run: npm ci
      - name: CloudMailin inbound unit tests
        run: npx vitest run tests/unit/phase-a2-inbound-webhook.test.js --reporter=verbose
      - name: Full unit regression
        run: npm test
      - name: Integration regression
        run: npm run test:integration
      - name: Full regression
        run: npm run test:all
