name: Verify

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record commit under test
        run: |
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "Commit message: $(git log -1 --pretty=%s)"
          git rev-parse HEAD

      - name: Writable DATA_DIR for tests
        run: |
          mkdir -p "$RUNNER_TEMP/agent-data"
          echo "DATA_DIR=$RUNNER_TEMP/agent-data" >> "$GITHUB_ENV"

      # Node 24 currently crashes better-sqlite3 on worker teardown
      # (Assertion failed: (env) != nullptr in Statement::~Statement).
      # Engines field allows >=20; pin 20 for stable native addon lifecycle.
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install system build deps (better-sqlite3 / Playwright)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-numpy ffmpeg libegl1 libgl1

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium (for integration tests)
        run: npx playwright install --with-deps chromium

      - name: Install Blender for actual 3D render tests
        run: sudo apt-get install -y blender

      - name: Install numpy into Blender embedded Python (for glTF export)
        run: |
          blender --background --python-expr "import ensurepip; ensurepip.bootstrap()"
          blender --background --python-expr "import subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install','numpy==1.26.4'])"

      - name: Run unit tests (npm test)
        run: npm test

      - name: Run integration tests (npm run test:integration)
        run: npm run test:integration

      - name: Run full suite (npm run test:all)
        run: npm run test:all
