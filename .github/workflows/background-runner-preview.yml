name: Background Runner Preview CI

on:
  push:
    branches:
      - feature/nexora-background-runner-preview
  pull_request:
    branches:
      - feature/cloudflare-replayguard-source-sync
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: background-runner-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Prepare isolated writable test data directory
        run: |
          sudo mkdir -p /data
          sudo chown -R "$USER":"$USER" /data
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Background runner contract tests
        run: npx vitest run tests/unit/background-runner-contract.test.js
      - name: Existing unit regression
        run: npm test

  neon-preview-target-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce Neon Preview target identity
        env:
          NEON_PREVIEW_PROJECT_ID: jolly-snow-82622444
          NEON_PREVIEW_BRANCH_ID: br-dark-firefly-b7kzhpec
          NEON_PREVIEW_DATABASE: neondb
        run: |
          test "$NEON_PREVIEW_PROJECT_ID" = "jolly-snow-82622444"
          test "$NEON_PREVIEW_BRANCH_ID" = "br-dark-firefly-b7kzhpec"
          test "$NEON_PREVIEW_DATABASE" = "neondb"
          echo "PASS: CI target is the approved Neon Phase 8 Preview branch only"
          echo "NOTE: This guard does not claim live SQL connectivity; credentials are intentionally not stored in this repository."
