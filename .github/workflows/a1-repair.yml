name: A1 Temporary MCP Repair
on:
  push:
    branches:
      - feature/phase-a1-client-communication
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message != 'fix(a1): remove MCP business idempotency field'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase-a1-client-communication
          fetch-depth: 0
      - name: Remove business idempotencyKey from MCP schema
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("mcp/tools.js")
          s=p.read_text()
          old="""      idempotencyKey: stringProperty('Required idempotency key.'),\n"""
          if old not in s:
              raise SystemExit("Expected A1 idempotencyKey schema field was not found")
          s=s.replace(old,"",1)
          p.write_text(s)
          PY
      - name: Verify and commit repair
        run: |
          node --check mcp/tools.js
          grep -n "client_delivery_send_approved" mcp/tools.js
          if grep -q "idempotencyKey: stringProperty" mcp/tools.js; then
            echo "business idempotencyKey still present"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp/tools.js .github/workflows/a1-repair.yml
          git commit -m "fix(a1): remove MCP business idempotency field"
          git push origin HEAD:feature/phase-a1-client-communication
