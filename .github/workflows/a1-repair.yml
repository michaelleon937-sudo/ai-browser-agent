name: A1 Temporary MCP Repair
on:
  workflow_dispatch:
  push:
    branches:
      - feature/phase-a1-client-communication
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase-a1-client-communication
          fetch-depth: 0
      - name: Repair MCP schema
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("mcp/tools.js")
          s=p.read_text()
          old="      idempotencyKey: stringProperty('Required idempotency key.'),\n"
          if old not in s:
              raise SystemExit("Expected A1 idempotencyKey schema field not found")
          p.write_text(s.replace(old,"",1))
          PY
      - name: Verify repair
        run: |
          node --check mcp/tools.js
          ! grep -q "idempotencyKey: stringProperty" mcp/tools.js
      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp/tools.js
          git rm .github/workflows/a1-repair.yml
          git commit -m "fix(a1): remove MCP business idempotency field"
          git push origin HEAD:feature/phase-a1-client-communication
